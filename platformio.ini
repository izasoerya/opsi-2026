; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32@6.6.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = time
build_flags = 
    -D ELEGANTOTA_USE_ASYNC_WEBSERVER=1
    -D TFT_ESPI_USER_SETUP_PATH=\"$PROJECT_DIR/include/display/display_tft_spi_lcd/user_setup.h\" ; If using TFT LCD
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

[env:pikohidro]
build_src_filter = +<*> -<projects/*/*.cpp> +<projects/pikohidro/main.cpp>
lib_deps =
    ayushsharma82/ElegantOTA@^3.1.7
    ayushsharma82/WebSerial@^2.1.2
    blynkkk/Blynk@^1.3.5
    adafruit/Adafruit SSD1306@^2.5.17
    robtillaart/ADS1X15@^0.6.2

[env:aquaponics]
build_src_filter = +<*> -<projects/*/*.cpp> +<projects/aquaponic/main.cpp>
lib_deps = 
    ayushsharma82/ElegantOTA@^3.1.7
    ayushsharma82/WebSerial@^2.1.2
    blynkkk/Blynk@^1.3.5
    adafruit/Adafruit SSD1306@^2.5.17
    robtillaart/DS18B20@^0.2.7
    robtillaart/ADS1X15@^0.6.2
    artronshop/ArtronShop_BH1750@^1.0.0

[env:bandung-persemaian-master]
lib_deps = 
    https://github.com/Bodmer/TFT_eSPI.git#16e37595040eac69cd628e4bffb56fc30cad6299
    https://github.com/eModbus/eModbus.git#6e4200d1a5213cf3004d60855c880604391f50af
    bblanchon/ArduinoJson@^7.4.3
    ayushsharma82/ElegantOTA@^3.1.7
    ayushsharma82/WebSerial@^2.1.2
build_src_filter = +<*> -<projects/*/*.cpp> +<projects/brin-bandung/master.cpp>

[env:bandung-persemaian-slave]
board = esp32-s3-devkitm-1
lib_deps = 
    https://github.com/eModbus/eModbus.git#6e4200d1a5213cf3004d60855c880604391f50af
    robtillaart/SHT2x@^0.5.5
    ayushsharma82/ElegantOTA@^3.1.7
    ayushsharma82/WebSerial@^2.1.2
    bblanchon/ArduinoJson@^7.4.3
board_build.flash_mode = dio
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_src_filter = +<*> -<projects/*/*.cpp> +<projects/brin-bandung/slave.cpp>
